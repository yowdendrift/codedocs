<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codebase docs</title>
<!-- Viewer for /codedocs. Built into the codedocs binary; the copy in a docs folder is
     replaced on /codedocs upgrade. Content lives in content/*.md, structure in
     manifest.json, look in theme.css. -->
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
<button class="icon-btn rail-btn" id="railBtn" aria-label="On this page" title="On this page" hidden><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M2 8h8M2 12.5h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <a href="#/" id="brand">Codebase docs<small id="brandSub"></small></a>
      <button class="icon-btn" id="themeBtn" title="Theme: auto" aria-label="Toggle theme"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </div>
    <input class="search" id="search" type="search" placeholder="Search docs  ( / )" autocomplete="off">
    <nav id="nav"></nav>
  </aside>
  <main class="main" id="main">
    <article class="page" id="page"><p class="empty">Loading…</p></article>
    <aside class="rail" id="rail"></aside>
  </main>
</div>
<aside class="code-panel" id="codePanel" aria-label="Code" hidden>
  <div class="code-resize" id="codeResize" title="Drag to resize"></div>
  <header class="code-head">
    <div class="code-title">
      <button class="icon-btn" id="codeBack" title="Back" hidden>&#8592;</button>
      <div class="code-path" id="codePath"></div>
      <button class="icon-btn" id="codeFiles" title="Browse the code" hidden><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.4 1.6h6a1 1 0 0 1 1 1v7.4a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="icon-btn" id="codeEditor" title="Open in editor" hidden><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2h5v5M14 2 7 9M12 9v4.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5H7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="icon-btn" id="codeClose" title="Close (Esc)" aria-label="Close">&#10005;</button>
    </div>
    <div class="code-meta" id="codeMeta"></div>
  </header>
  <div class="code-body" id="codeBody"></div>
  <div class="toast" id="toast" hidden></div>
</aside>
<div class="dlg" id="dlg" hidden role="dialog" aria-label="Diagram">
  <div class="dlg-box">
    <div class="dlg-view" id="dlgView"><div class="dlg-stage" id="dlgStage"></div></div>
    <div class="dlg-bar">
      <button class="icon-btn" id="dlgOut" title="Zoom out (-)">&#8722;</button>
      <span class="dlg-zoom" id="dlgZoom">100%</span>
      <button class="icon-btn" id="dlgIn" title="Zoom in (+)">+</button>
      <button class="icon-btn" id="dlgFit" title="Fit (0)"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="icon-btn" id="dlgClose" title="Close (Esc)">&#10005;</button>
    </div>
    <div class="dlg-hint">Scroll to zoom · drag to move · double-click to fit</div>
  </div>
</div>
<script>
(() => {
  // Browser libraries: served by the codedocs binary from lib/, or from the CDN when the
  // docs folder is hosted as plain static files.
  const LIBS = {
    marked: ['lib/marked.js', 'https://cdn.jsdelivr.net/npm/marked@18.1.2/lib/marked.umd.js'],
    mermaid: ['lib/mermaid.js', 'https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.min.js'],
    d3: ['lib/d3.js', 'https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js'],
    markmapView: ['lib/markmap-view.js', 'https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js'],
    markmapLib: ['lib/markmap-lib.js', 'https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/browser/index.iife.js'],
    hljs: ['lib/highlight.js', 'https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/highlight.min.js'],
  };
  const GROUPS = [
    ['overview', 'Start here'], ['topic', 'Topics'], ['component', 'Components'], ['flow', 'Flows'], ['concern', 'Concerns'],
    ['glossary', 'Reference'], ['gotchas', 'Reference'], ['decision', 'Decisions'], ['change', 'Changes'], ['page', 'Other'],
  ];
  const KIND_LABEL = { overview: 'Overview', topic: 'Topic', component: 'Component', flow: 'Flow', concern: 'Concern', decision: 'Decision', glossary: 'Glossary', gotchas: 'Gotchas', change: 'Change', page: 'Page', map: 'Map' };
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = s => String(s).toLowerCase().replace(/<[^>]+>/g, '').replace(/[`*_~]/g, '').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
  const kindVar = k => `--kind: var(--kind-${k === 'map' ? 'overview' : k})`;

  let M = null;               // manifest
  let API = null;             // code panel available: served by the codedocs binary, or a static export
  let STATIC = null;          // code/index.json when this is a static export (codedocs export)
  const byId = new Map();     // page id -> manifest entry
  const textCache = new Map();
  const loaded = {};

  // ---------- theme ----------
  const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  let theme = store.get('docs-theme') || 'auto';
  const effectiveDark = () => theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  function applyTheme() {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    $('#themeBtn').title = `Theme: ${theme}`;
  }
  $('#themeBtn').onclick = () => { theme = { auto: 'light', light: 'dark', dark: 'auto' }[theme]; store.set('docs-theme', theme); applyTheme(); route(); };
  applyTheme();
  $('#menuBtn').onclick = () => { document.body.classList.remove('rail-open'); document.body.classList.toggle('nav-open'); };
  // On narrow screens the rail becomes a drawer from the right, opened with this button.
  $('#railBtn').onclick = () => { document.body.classList.remove('nav-open'); document.body.classList.toggle('rail-open'); };
  const syncRailBtn = () => { $('#railBtn').hidden = !$('#rail').innerHTML.trim(); if ($('#railBtn').hidden) document.body.classList.remove('rail-open'); };
  new MutationObserver(syncRailBtn).observe($('#rail'), { childList: true });
  document.addEventListener('click', e => {
    if (!document.body.classList.contains('rail-open')) return;
    if (e.target.closest('#rail a[href^="#"]:not([data-tree-file])') ) document.body.classList.remove('rail-open');
    else if (!e.target.closest('#rail, #railBtn')) document.body.classList.remove('rail-open');
  });

  // ---------- loading ----------
  function loadScript(src) {
    return loaded[src] ||= new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete loaded[src]; s.remove(); rej(new Error('Could not load ' + src)); }; document.head.appendChild(s); });
  }
  async function loadLib(name) {
    const [local, cdn] = LIBS[name];
    try { await loadScript(local); } catch { await loadScript(cdn); }
  }
  async function getText(file) {
    if (textCache.has(file)) return textCache.get(file);
    const r = await fetch('content/' + file, { cache: 'no-store' });
    if (!r.ok) throw new Error(`content/${file}: ${r.status}`);
    const t = (await r.text()).replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, '');
    textCache.set(file, t);
    return t;
  }

  // ---------- code source: the codedocs server's API, or a static export ----------
  // A static export (codedocs export) has no server. The source comes from STATIC.source
  // (raw.githubusercontent.com pinned to a commit), and code/ holds what the server would
  // otherwise work out: the file list, import links and a definitions index.
  const encPath = f => f.split('/').map(encodeURIComponent).join('/');
  const dirOf = f => f.includes('/') ? f.slice(0, f.lastIndexOf('/')) : '.';
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const globCache = new Map();
  function globRe(g) { // same rules as the tool: * within a folder, ** across, {a,b}, trailing / = everything under
    if (globCache.has(g)) return globCache.get(g);
    let re = '^';
    for (let i = 0; i < g.length; i++) {
      const c = g[i];
      if (c === '*') {
        if (g[i + 1] === '*') { i++; if (g[i + 1] === '/') { i++; re += '(?:.*/)?'; } else re += '.*'; }
        else re += '[^/]*';
      } else if (c === '?') re += '[^/]';
      else if (c === '{' && g.indexOf('}', i) > 0) { const end = g.indexOf('}', i); re += '(?:' + g.slice(i + 1, end).split(',').map(reEsc).join('|') + ')'; i = end; }
      else re += reEsc(c);
    }
    if (g.endsWith('/')) re += '.*';
    const r = new RegExp(re + '$');
    globCache.set(g, r);
    return r;
  }
  const matchAny = (f, globs) => globs.some(g => globRe(g).test(f));
  async function getJSON(url) {
    const r = await fetch(url, { cache: 'no-store' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `${url}: ${r.status}`);
    return d;
  }
  const metaCache = new Map(), SYMS = {};
  let defsData = null;
  function fileMeta(f) {
    if (!STATIC.hasMeta.has(f)) return Promise.resolve({});
    if (!metaCache.has(f)) metaCache.set(f, fetch('code/meta/' + encPath(f) + '.json').then(r => r.ok ? r.json() : {}).catch(() => ({})).then(m => { Object.assign(SYMS, m.syms || {}); return m; }));
    return metaCache.get(f);
  }
  function findSymbolLine(text, symbol) { // fallback when the export didn't record the line
    const name = reEsc(symbol.split('.').pop()), rows = text.split('\n');
    const def = new RegExp(`\\b(?:func|function|class|def|type|interface|enum|struct|trait|const|let|var|fn)\\s+(?:\\([^)]*\\)\\s*)?${name}\\b`);
    let i = rows.findIndex(l => def.test(l));
    if (i < 0) { const w = new RegExp(`\\b${name}\\b`); i = rows.findIndex(l => w.test(l)); }
    return i + 1;
  }
  const Code = {
    async file(file, symbol) {
      if (!STATIC) return getJSON(`api/file?path=${encodeURIComponent(file)}${symbol ? '&symbol=' + encodeURIComponent(symbol) : ''}`);
      if (!STATIC.set.has(file)) throw new Error(`${file} isn't part of this export (missing, ignored or binary).`);
      const [r, meta] = await Promise.all([fetch(STATIC.source + encPath(file)), fileMeta(file)]);
      if (!r.ok) throw new Error(`Couldn't load ${file} (${r.status} from ${new URL(STATIC.source, location.href).host}).`);
      const text = (await r.text()).replace(/^\uFEFF/, '').replace(/\r\n/g, '\n');
      const components = M.pages.filter(p => p.kind === 'component' && matchAny(file, p.paths || [])).map(p => ({ id: p.id, title: p.title }));
      const symbolLine = symbol ? (M.symbols[`${file}#${symbol}`] || SYMS[`${file}#${symbol}`] || findSymbolLine(text, symbol)) : 0;
      return { path: file, text, lines: text.split('\n').length, symbolLine, components, links: meta.links };
    },
    async files(globs) {
      if (!STATIC) return (await getJSON('api/files?' + globs.map(g => 'glob=' + encodeURIComponent(g)).join('&'))).files;
      return STATIC.files.filter(f => !globs.length || matchAny(f, globs));
    },
    // Go to definition: the file's imports, then the same file, then everything ranked by closeness.
    async definition(name, from) {
      if (!STATIC) return (await getJSON(`api/definition?name=${encodeURIComponent(name)}&from=${encodeURIComponent(from)}`)).matches || [];
      defsData ||= getJSON('code/defs.json');
      const all = ((await defsData)[name] || []).map(([i, line]) => ({ file: STATIC.files[i], line }));
      const meta = from ? await fileMeta(from) : {};
      const imp = meta.imports?.[name];
      if (imp && imp.dir) { const inside = all.filter(d => dirOf(d.file) === imp.path); if (inside.length) return inside; }
      else if (imp) return [{ file: imp.path, line: imp.line || 1, kind: 'import' }];
      const local = all.filter(d => d.file === from);
      if (local.length) return local.slice(0, 1);
      const near = {};
      for (const l of meta.links || []) near[l.dir ? l.path : dirOf(l.path)] = 2;
      near[dirOf(from)] = Math.max(near[dirOf(from)] || 0, 1);
      return all.map((d, i) => ({ d, i, n: near[dirOf(d.file)] || 0 }))
        .sort((a, b) => b.n - a.n || (a.d.file < b.d.file ? -1 : a.d.file > b.d.file ? 1 : a.i - b.i)).slice(0, 40).map(x => x.d);
    },
  };
  const sourceName = () => STATIC?.repo ? 'GitHub' : 'the source host';

  // ---------- code refs ----------
  const REF = /^([A-Za-z0-9_.\-\/@~+]+\.[A-Za-z0-9]+)(?::(\d+)(?:-(\d+))?)?(?:#([A-Za-z_$][\w$.]*))?$/;
  function editorHref(file, line) {
    if (STATIC) return STATIC.web ? `${STATIC.web}${encPath(file)}${line ? '#L' + line : ''}` : null;
    const editor = M.editor;
    if (editor !== 'vscode' && editor !== 'cursor') return null;
    const root = (M.repo_root_abs || '').replace(/\/$/, '').replace(/^\/+/, '');
    return `${editor}://file/${encodeURI(root + '/' + file)}:${line || 1}`;
  }
  function refHtml(text) {
    const m = text.match(REF);
    if (!m || (!m[1].includes('/') && !m[2] && !m[4])) return null;
    const [, file, line, end, symbol] = m;
    const ln = line || (symbol && M.symbols[`${file}#${symbol}`]) || '';
    const data = `data-file="${esc(file)}" data-line="${esc(ln)}" data-end="${esc(end || '')}" data-symbol="${esc(symbol || '')}"`;
    const ed = editorHref(file, ln);
    if (API) return `<a class="ref" href="${esc(ed || '#')}" ${data} title="Show ${esc(file)}${ln ? ' line ' + ln : ''}${ed ? ` (Ctrl+click: open ${STATIC ? 'on ' + sourceName() : 'in editor'})` : ''}">${esc(text)}</a>`;
    if (ed) return `<a class="ref" href="${esc(ed)}" title="Open in ${M.editor}: ${esc(file)}${ln ? ' line ' + ln : ''}">${esc(text)}</a>`;
    return `<span class="ref" title="${esc(file)}${ln ? ' line ' + ln : ''}">${esc(text)}</span>`;
  }

  // ---------- markdown ----------
  let currentFile = '';
  let currentPageId = '';     // page shown in the main column
  let codeOwner = null;       // component that owns the file open in the panel
  const resolvePage = href => {
    const base = currentFile.split('/').slice(0, -1);
    for (const part of href.split('/')) { if (part === '..') base.pop(); else if (part !== '.') base.push(part); }
    return base.join('/').replace(/\.md$/, '');
  };
  function setupMarked() {
    marked.use({
      gfm: true,
      renderer: {
        code({ text, lang }) {
          if ((lang || '').trim() === 'mermaid') return `<div class="diagram mermaid-src">${esc(text)}</div>`;
          return false;
        },
        codespan({ text }) {
          const raw = text.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
          return refHtml(raw) || false;
        },
        link({ href, title, tokens }) {
          const inner = this.parser.parseInline(tokens);
          const m = href.match(/^(?!\w+:)([^#]+\.md)(#.*)?$/);
          if (m) {
            const id = resolvePage(m[1]);
            const section = m[2] ? '::' + m[2].slice(1) : '';
            return `<a href="#/${esc(id)}${esc(section)}"${title ? ` title="${esc(title)}"` : ''}>${inner}</a>`;
          }
          return false;
        },
        heading({ tokens, depth }) {
          const inner = this.parser.parseInline(tokens);
          return `<h${depth} id="${slug(inner)}">${inner}</h${depth}>\n`;
        },
        blockquote({ tokens }) {
          const first = tokens[0];
          const m = first && first.type === 'paragraph' && first.raw.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION|INFERRED|INSIGHT)\]\s*/i);
          if (!m) return false;
          const kind = m[1].toLowerCase();
          first.raw = first.raw.slice(m[0].length);
          first.text = first.text.replace(/^\[![A-Za-z]+\]\s*/, '');
          first.tokens = marked.Lexer.lexInline(first.text);
          const label = kind === 'inferred' ? 'Inferred from the code' : kind === 'insight' ? 'From the team' : kind;
          return `<div class="callout ${kind}"><div class="callout-title">${label}</div>${this.parser.parse(tokens)}</div>`;
        },
      },
    });
  }
  function tagInferred(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.nodeValue.includes('(inferred)') && !n.parentElement.closest('code,pre,.callout-title') ? 1 : 3 });
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const n of nodes) {
      const frag = document.createDocumentFragment();
      n.nodeValue.split('(inferred)').forEach((part, i, arr) => {
        frag.append(part);
        if (i < arr.length - 1) { const s = document.createElement('span'); s.className = 'inferred-tag'; s.textContent = 'inferred'; s.title = 'Worked out from the code, not confirmed by a person'; frag.append(s); }
      });
      n.replaceWith(frag);
    }
  }
  async function renderDiagrams(root) {
    const blocks = [...root.querySelectorAll('.mermaid-src')];
    if (!blocks.length) return;
    try {
      await loadLib('mermaid');
      mermaid.initialize({ startOnLoad: false, theme: effectiveDark() ? 'dark' : 'neutral', securityLevel: 'strict', fontFamily: getComputedStyle(document.body).fontFamily });
    } catch (e) { blocks.forEach(b => { b.classList.add('error'); b.textContent = e.message + '\n\n' + b.textContent; }); return; }
    let n = 0;
    for (const b of blocks) {
      const src = b.textContent;
      try { const { svg } = await mermaid.render(`mmd-${Date.now()}-${n++}`, src); b.innerHTML = svg + '<button class="icon-btn expand" title="Open larger" aria-label="Open larger"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2h4v4M14 2 9 7M6 14H2v-4M2 14l5-5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>'; b.classList.remove('mermaid-src'); }
      catch (e) { b.classList.add('error'); b.textContent = `Diagram error: ${e.message || e}\n\n${src}`; }
    }
  }

  // ---------- code panel ----------
  const LANG = {
    ts: 'typescript', tsx: 'typescript', mts: 'typescript', cts: 'typescript', js: 'javascript', jsx: 'javascript', mjs: 'javascript', cjs: 'javascript',
    php: 'php', go: 'go', py: 'python', gd: 'python', rb: 'ruby', rs: 'rust', java: 'java', kt: 'kotlin', kts: 'kotlin', cs: 'csharp',
    c: 'c', h: 'c', cc: 'cpp', cpp: 'cpp', hpp: 'cpp', m: 'objectivec', mm: 'objectivec', swift: 'swift', lua: 'lua', sql: 'sql', r: 'r', pl: 'perl',
    css: 'css', scss: 'scss', less: 'less', json: 'json', yml: 'yaml', yaml: 'yaml', toml: 'ini', ini: 'ini', cfg: 'ini', conf: 'ini', godot: 'ini', tscn: 'ini', tres: 'ini',
    md: 'markdown', html: 'xml', htm: 'xml', xml: 'xml', svg: 'xml', vue: 'xml', svelte: 'xml', twig: 'xml', sh: 'bash', bash: 'bash', zsh: 'bash',
    ps1: 'powershell', bat: 'dos', dockerfile: 'dockerfile', graphql: 'graphql', diff: 'diff', wasm: 'wasm', mk: 'makefile',
  };
  const langFor = file => { const b = file.split('/').pop().toLowerCase(); if (b === 'dockerfile') return 'dockerfile'; if (b === 'makefile') return 'makefile'; return LANG[b.includes('.') ? b.split('.').pop() : ''] || ''; };
  const panel = $('#codePanel');
  let codeState = null;       // { file, line, end } or { list, title }
  const codeHistory = [];     // earlier panel states, for the back button

  // Split highlighted HTML into lines, re-opening spans that cross line breaks.
  function splitHtmlLines(html) {
    const out = [], stack = [];
    let cur = '', last = 0, m;
    const re = /<span class="([^"]*)">|<\/span>|\n/g;
    while ((m = re.exec(html))) {
      cur += html.slice(last, m.index); last = re.lastIndex;
      if (m[0] === '\n') { out.push(cur + '</span>'.repeat(stack.length)); cur = stack.map(c => `<span class="${c}">`).join(''); }
      else if (m[0] === '</span>') { stack.pop(); cur += m[0]; }
      else { stack.push(m[1]); cur += m[0]; }
    }
    out.push(cur + html.slice(last));
    return out;
  }
  async function highlight(text, lang) {
    try {
      await loadLib('hljs');
      if (lang && hljs.getLanguage(lang)) return hljs.highlight(text, { language: lang, ignoreIllegals: true }).value;
    } catch {}
    return esc(text);
  }

  // ---- code links: the server's language packs resolve imports; we make them clickable. ----
  // Wrap the nth occurrence of each link's text on its line. The text can span several
  // highlight spans (e.g. PHP namespaces), so each text-node piece gets its own wrapper.
  function applyLinks(links) {
    for (const l of links || []) {
      const row = document.querySelector(`#code-L${l.line} .cc`);
      if (!row) continue;
      const nodes = [], walker = document.createTreeWalker(row, NodeFilter.SHOW_TEXT);
      let full = '', n;
      while ((n = walker.nextNode())) { nodes.push({ n, at: full.length }); full += n.nodeValue; }
      let idx = -1, from = 0;
      for (let k = 0; k <= l.nth; k++) { idx = full.indexOf(l.text, from); if (idx < 0) break; from = idx + l.text.length; }
      if (idx < 0) continue;
      const end = idx + l.text.length;
      for (const { n: node, at } of nodes) {
        const len = node.nodeValue.length; // read before splitting: splitText shortens node
        const a = Math.max(idx, at), b = Math.min(end, at + len);
        if (a >= b || node.parentElement.closest('.imp')) continue;
        let piece = node;
        if (a > at) piece = piece.splitText(a - at);
        if (b - a < piece.nodeValue.length) piece.splitText(b - a);

  // ---------- file trees (rail) ----------

  function treeHtml(paths, clickable, collapseDeep) {
    const rootNode = { dirs: new Map(), files: [] };
    for (const f of paths) {
      const parts = f.split('/');
      let node = rootNode;
      for (const d of parts.slice(0, -1)) {
        if (!node.dirs.has(d)) node.dirs.set(d, { dirs: new Map(), files: [] });
        node = node.dirs.get(d);
      }
      node.files.push({ name: parts[parts.length - 1], path: f });
    }
    const mentioned = f => M.pages.some(p => (p.refs || []).includes(f));
    const render = (node, depth) => {
      let html = '';
      for (const [name0, child0] of [...node.dirs].sort((a, b) => a[0].localeCompare(b[0]))) {
        let name = name0, child = child0;
        while (child.files.length === 0 && child.dirs.size === 1) {
          const [n, c] = [...child.dirs][0];
          name += '/' + n; child = c;
        }
        html += `<li><details${collapseDeep && depth > 0 ? '' : ' open'}><summary>${esc(name)}/</summary><ul>${render(child, depth + 1)}</ul></details></li>`;
      }
      for (const f of node.files.sort((a, b) => a.name.localeCompare(b.name))) {
        html += clickable
          ? `<li><a class="file" href="#" data-tree-file="${esc(f.path)}" title="${esc(f.path)}">${esc(f.name)}${mentioned(f.path) ? '<span class="mark" title="Mentioned in the docs"></span>' : ''}</a></li>`
          : `<li><span class="file">${esc(f.name)}</span></li>`;

    };

    const meta = [p.updated && `Updated ${esc(p.updated)}`, p.generated_with && `written with /codedocs ${esc(p.generated_with)}`, p.locked && 'locked (not regenerated)', `content/${esc(p.file)}`].filter(Boolean).join(' · ');
    $('#page').innerHTML = `<header class="page-head"><div class="crumbs">${badges.join('')}</div><h1>${esc(p.title)}</h1>${p.summary ? `<p class="summary">${esc(p.summary)}</p>` : ''}</header>
      <div class="prose" id="prose">${marked.parse(md)}</div><div class="meta">${meta}</div>`;
    $('#rail').innerHTML = rail(p);
    fillRailTree(p);
    $('#main').classList.remove('wide');
    document.title = `${p.title} · ${M.project}`;
    markActive(id);
    tagInferred($('#prose'));
    await renderDiagrams($('#prose'));
    if (section) document.getElementById(section)?.scrollIntoView();
    else window.scrollTo(0, 0);
  }

  function showHome() {
    const ov = M.pages.find(p => p.kind === 'overview');
    if (ov) return showPage(ov.id);
    const cards = M.pages.map(p => `<a class="card" href="#/${esc(p.id)}" style="${kindVar(p.kind)}"><strong><span class="dot"></span>${esc(p.title)}</strong><span>${esc(p.summary || KIND_LABEL[p.kind])}</span></a>`).join('');
    $('#page').innerHTML = `<header class="page-head"><h1>${esc(M.project)}</h1></header>${cards ? `<div class="cards">${cards}</div>` : '<p class="notice">No pages yet. Run <code>/codedocs init</code>.</p>'}`;
    $('#rail').innerHTML = ''; markActive('');
  }

  // A component's sub-parts: the ### headings under "## Parts" (falls back to any ### headings).
  function partsOf(p) {
    const out = [], any = [];
    let inParts = false;
    for (const h of p.headings) {
      if (h.level === 2) inParts = /^parts?$/i.test(h.text.trim());
      else if (h.level === 3) { any.push(h); if (inParts) out.push(h); }
    }
    return out.length ? out : any;
  }

  async function showMap() {
    markActive('map');
    $('#rail').innerHTML = '';
    $('#main').classList.add('wide');
    document.title = `Map · ${M.project}`;
    $('#page').style.maxWidth = 'none';
    $('#page').innerHTML = `<header class="page-head"><div class="crumbs"><span class="badge" style="${kindVar('map')}">Map</span></div><h1>${esc(M.project)} at a glance</h1><p class="summary">Components and their parts, the flows that run through them, and the concerns that cut across. Click a node to fold it; click a name to open its page.</p></header><div class="map-wrap" id="mapWrap"><svg id="mapSvg"></svg></div>`;
    const lines = [`# ${M.project}`];
    const section = (title, kind, withHeadings) => {
      const list = M.pages.filter(p => p.kind === kind);
      if (!list.length) return;
      lines.push(`## ${title}`);
      for (const p of list) {
        lines.push(`### [${p.title}](#/${p.id})`);
        if (withHeadings) for (const h of partsOf(p)) lines.push(`- [${h.text}](#/${p.id}::${slug(esc(h.text))})`);
        if (kind === 'flow' && p.components?.length) lines.push(`- via ${p.components.map(c => byId.get(c)?.title || c).join(' → ')}`);
      }
    };
    section('Topics', 'topic', false);
    section('Components', 'component', true);
    section('Flows', 'flow', false);
    section('Concerns', 'concern', false);
    try {
      await loadLib('d3');
      await loadLib('markmapView');
      await loadLib('markmapLib');
      const { Transformer, Markmap } = window.markmap;
      const { root } = new Transformer().transform(lines.join('\n'));
      Markmap.create('#mapSvg', { initialExpandLevel: 4, duration: 300, paddingX: 12, spacingVertical: 8 }, root);
    } catch (e) { $('#mapWrap').innerHTML = `<p class="notice">Couldn't draw the map: ${esc(e.message)}</p>`; }
  }

  async function showSearch(q) {
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    $('#rail').innerHTML = ''; markActive(''); $('#main').classList.remove('wide');
    $('#page').innerHTML = `<header class="page-head"><h1>Search</h1><p class="summary">“${esc(q)}”</p></header><div id="results"><p class="empty">Searching…</p></div>`;
    await Promise.all(M.pages.map(p => getText(p.file).catch(() => '')));
    const plain = t => t.replace(/^(```|~~~)[\s\S]*?^\1/gm, '').split('\n')
      .map(l => l.replace(/^\s*(#+|[-*+]|\d+\.|>(\s*\[![A-Z]+\])?)\s+/, '').replace(/\|/g, ' ').replace(/[*_`]/g, '').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/\s+/g, ' ').trim())
      .filter(l => l && !/^-{3,}$/.test(l) && !/^[\s:-]+$/.test(l));
    const hits = [];
    for (const p of M.pages) {
      const text = textCache.get(p.file) || '';
      const hay = (p.title + ' ' + p.summary + ' ' + text).toLowerCase();
      if (!terms.every(t => hay.includes(t))) continue;
      let score = terms.reduce((s, t) => s + (p.title.toLowerCase().includes(t) ? 10 : 0) + (p.headings.some(h => h.text.toLowerCase().includes(t)) ? 4 : 0) + Math.min(5, hay.split(t).length - 1), 0);
      const lineHit = plain(text).find(l => terms.some(t => l.toLowerCase().includes(t))) || p.summary;
      let snip = esc((lineHit || '').slice(0, 220));
      for (const t of terms) snip = snip.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);
      hits.push({ p, score, snip });
    }
    hits.sort((a, b) => b.score - a.score);
    $('#results').innerHTML = hits.length ? hits.map(({ p, snip }) => `<div class="result"><a href="#/${esc(p.id)}"><span class="badge" style="${kindVar(p.kind)}">${KIND_LABEL[p.kind]}</span> ${esc(p.title)}</a><p>${snip}</p></div>`).join('') : '<p class="empty">Nothing found.</p>';
  }

  function showMissing(id) { $('#page').innerHTML = `<p class="notice">No page called <code>${esc(id)}</code>. It may have been renamed. Rebuild the manifest with <code>/codedocs check</code>.</p>`; $('#rail').innerHTML = ''; }
  function showError(e) { $('#page').innerHTML = `<p class="notice">${esc(e.message || e)}</p>`; }

  let searchTimer;
  $('#search').addEventListener('input', e => { clearTimeout(searchTimer); const q = e.target.value.trim(); searchTimer = setTimeout(() => { location.hash = q ? '#/search/' + encodeURIComponent(q) : '#/'; }, 250); });
  document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#search').focus(); } });

  async function route() {
    document.body.classList.remove('nav-open', 'rail-open');
    $('#page').style.maxWidth = '';
    const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    if (!h) return showHome();
    if (h === 'map') return showMap();
    if (h.startsWith('search/')) return showSearch(h.slice(7));
    const [id, section] = h.split('::');
    return showPage(id, section);
  }

  async function init() {
    if (location.protocol === 'file:') {
      $('#page').innerHTML = '<p class="notice">This viewer needs to be served, not opened as a file. Ask Claude for <code>/codedocs serve</code>, or run <code>codedocs serve</code> in the repo, and open the address it prints.</p>';
      return;
    }
    try { await loadLib('marked'); setupMarked(); }
    catch (e) { return showError(new Error('Could not load the markdown renderer. Serve the docs with codedocs serve, or check your internet connection.')); }
    try {
      const r = await fetch('manifest.json', { cache: 'no-store' });
      if (!r.ok) throw new Error('manifest.json not found. Run /codedocs init (or /codedocs check to rebuild it).');
      M = await r.json();
    } catch (e) { return showError(e); }
    if (M.static) { // a static export (codedocs export): the code panel reads code/index.json
      try {
        const r = await fetch('code/index.json', { cache: 'no-store' });
        if (r.ok) {
          STATIC = await r.json();
          STATIC.set = new Set(STATIC.files);
          STATIC.hasMeta = new Set((STATIC.meta || []).map(i => STATIC.files[i]));
          API = { static: true, files: STATIC.files.length };
        }
      } catch {}
    } else {
      try { const r = await fetch('api/info', { cache: 'no-store' }); if (r.ok) API = await r.json(); } catch {}
    }
    M.symbols ||= {};
    M.pages.forEach(p => byId.set(p.id, p));
    $('#brand').firstChild.textContent = M.project;
    $('#brandSub').textContent = `${M.pages.length} pages · /codedocs ${M.skill_version}`;
    if (STATIC?.ref) $('#brandSub').title = `Code shown from ${STATIC.repo || STATIC.source} at ${STATIC.ref.slice(0, 7)}`;
    document.title = M.project;
    buildNav();
    window.addEventListener('hashchange', route);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => theme === 'auto' && route());
    route();
  }
  init();
})();
</script>
</body>
</html>
